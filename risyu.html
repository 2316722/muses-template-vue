<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>履修登録</title>
    <link href="index.css" rel="stylesheet" />
  </head>
  <body>
    <header>
      <figure id="logo">
        <img src="img/logo.png" />
      </figure>
      <div id="user_name"><img src="img/user_icon.png" />{{username}} さん</div>
      <div id="link">
        <div><a href="index.html">HOME</a></div>
      </div>
    </header>

    <main>
      <h1>履修登録ページ</h1>
      <p>登録したい科目を選択してください。</p>
      <form id="registration-form">
        <label><input type="checkbox" name="subject" value="数学" /> 数学</label><br />
        <label><input type="checkbox" name="subject" value="英語" /> 英語</label><br />
        <label><input type="checkbox" name="subject" value="物理" /> 物理</label><br />
        <button type="submit">登録</button>
      </form>
    </main>

    <footer>
      <p>Information</p>
    </footer>

    <script src="index.js"></script>
  </body>
</html>
